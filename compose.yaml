services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      PORT: "8000"
      SHENNONG_PUBLIC_ORIGIN: "https://${DOMAIN}"
      SHENNONG_CONVERSATIONS_DB: /var/lib/shennong/conversations.sqlite3
      UYGHUR_ASR_MODEL_PATH: /opt/shennong/models/uyghur_asr.onnx
      SHENNONG_REQUESTS_PER_MINUTE: "6"
      SHENNONG_DAILY_REQUESTS: "20"
    volumes:
      - shennong_data:/var/lib/shennong
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  shennong_data:
  caddy_data:
  caddy_config:
